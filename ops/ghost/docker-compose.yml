# Ghost Blog Docker Stack
#
# Deployment steps:
# 1. cp ops/ghost/.env.example /opt/stacks/web/ghost/.env  (fill passwords)
# 2. docker compose -f ops/ghost/docker-compose.yml up -d
# 3. Configure NPM: blog.fechal-batakpale.com -> ghost-blog:2368
# 4. Fetch Ghost Content API Key and add to fechal-webapp .env
# 5. Rebuild fechal-webapp
#
version: '3.8'

services:
  ghost-db:
    image: mysql:8.0
    container_name: ghost-db
    restart: unless-stopped
    volumes:
      - ghost-db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${GHOST_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ghost_prod
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${GHOST_DB_PASSWORD}
    networks:
      - web-network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 30s
      timeout: 10s
      retries: 5

  ghost-blog:
    image: ghost:5-alpine
    container_name: ghost-blog
    restart: unless-stopped
    depends_on:
      ghost-db:
        condition: service_healthy
    volumes:
      - ghost-content:/var/lib/ghost/content
    environment:
      url: https://blog.fechal-batakpale.com
      database__client: mysql
      database__connection__host: ghost-db
      database__connection__user: ghost
      database__connection__password: ${GHOST_DB_PASSWORD}
      database__connection__database: ghost_prod
      mail__transport: Direct
      NODE_ENV: production
    networks:
      - web-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:2368/ghost/api/content/site/']
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 120s

networks:
  web-network:
    external: true
    name: web-network

volumes:
  ghost-db-data:
  ghost-content:
